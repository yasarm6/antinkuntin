<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="akGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62"/>
      <stop offset="50%" stop-color="#FF9966"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF5E62" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Mascot / Icon -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- Quirky Spiral / Wandering Shape -->
    <rect x="0" y="0" width="64" height="64" rx="20" fill="url(#akGrad)" />
    <!-- Antin Kuntin funny eyes & smile -->
    <circle cx="24" cy="28" r="6" fill="#1e1e24" />
    <circle cx="26" cy="26" r="2" fill="#ffffff" />
    <circle cx="42" cy="28" r="6" fill="#1e1e24" />
    <circle cx="44" cy="26" r="2" fill="#ffffff" />
    <!-- Playful wobbly smirk -->
    <path d="M 22 42 Q 32 50 44 40" stroke="#1e1e24" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Antenna/sparkle -->
    <circle cx="56" cy="10" r="4" fill="#FFE66D" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(86, 48)">
    <text font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="-1">
      <tspan fill="#1e293b" class="logo-text-p1">antin</tspan>
      <tspan fill="#FF5E62">.</tspan>
      <tspan fill="url(#akGrad)" class="logo-text-p2">kuntin</tspan>
    </text>
    <text y="18" x="2" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#94a3b8" letter-spacing="2">İNTERAKTİF DENEYİMLER</text>
  </g>
</svg>
